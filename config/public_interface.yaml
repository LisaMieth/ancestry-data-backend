# Interface contract for the public-facing DB (see src/build_public_db.py).
# All tables & columns listed here are exposed in the public DB build, all others are excluded.

tables:
  dim_person:
    schema: gold
    columns:
      - id
      - full_name
      - last_name_normed
      - last_name_id
      - in_lineage
      - year_birth
      - year_death
      - place
      - latitude
      - longitude

  dim_last_name:
    schema: gold
    columns:
      - id
      - last_name_normed

  fct_family_branch:
    schema: gold
    columns:
      - root_id
      - root_full_name
      - last_name_id
      - root_location
      - root_date_ref
      - ancestor_id
      - ancestor_full_name
      - ancestor_location_name
      - ancestor_geolocation
      - ancestor_date_ref
      - ancestor_hops
